<!DOCTYPE html>
<html>
    <head>
        <title>Flowers</title>
        <link rel="stylesheet" href="style.css">
        <!-- tag to make the website more responsive -->
        <meta name="viewport" content="width=device-width,initial-scale=1.0">

        <!-- THE ANIMATE.STYLE CSS Library -->
          <link
   rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
    </head>
    <body>
<!-- SUNFLOWERS SECTION -->
        <section id="sunflowersgroup">
            <div id="sunhover" class="sunflower"><img can-grow src="flower-images/sunflower.png" alt="sunflower image"></div>
            <div class="sunflower animate__animated animate__bounce"><img can-spin src="flower-images/sunflower.png" alt="sunflower image"></div>
            <div class="sunflower animate__animated  animate__fadeInDownBig"><img src="flower-images/sunflower.png" alt="sunflower image"></div>
            <div class="sunflower suntarget"><img src="flower-images/sunflower.png" alt="sunflower image"></div>
            <div class="sunflower suntarget"><img src="flower-images/sunflower.png" alt="sunflower image"></div>
        </section>

<!-- ROSE DAISY SECTION -->
        <section id="textgroup">
            <div id="roseclick" class="rose"><img can-move src="flower-images/rose.png" alt="pink rose image"></div>
            <div id="daisyclick" class="daisy"><img can-move src="flower-images/daisy.png" alt="white daisy image"></div>        
            <div class="rosetext"><h2>A rose is either a woody perennial flowering plant of the genus Rosa in the family Rosaceae or the flower it bears. </h2></div>
            <div class="daisytext"><h2>The flowers called daisy include a central, buttonlike disk of microscopic flowers encompassed by a ring of raylike petals. </h2></div>
        </section>


<!-- PlayHTML JS Library -->
 <script type="module" src="https://unpkg.com/playhtml/dist/init.es.js"></script>

<!-- linking the JS file to HTML -->
<script src="myscript.js"></script>  

    </body>
</html>
